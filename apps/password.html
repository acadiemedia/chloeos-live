<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Password Generator — ChloeOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#fff;border-bottom:1px solid #e0e0e5;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.hdr .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00c6ff,#0072ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.hdr .t{font-weight:700;font-size:17px}
.hdr .sub{font-size:11px;color:#86868b;font-weight:400}
.hdr .back{margin-left:auto;color:#0072ff;text-decoration:none;font-size:15px}
.main{flex:1;padding:20px;max-width:600px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
.btn{display:block;width:100%;background:#0072ff;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn:active{opacity:.8}
.btn.sec{background:#e8e8ed;color:#0072ff}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid #d2d2d7;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;background:#fafafa}
textarea:focus,input:focus{outline:none;border-color:#0072ff}
.out{background:#f0f7ff;border-radius:12px;padding:14px;margin-top:12px;font-size:15px;line-height:1.6;word-break:break-word}
.ftr{text-align:center;padding:20px;color:#86868b;font-size:12px}
.ftr b{color:#0072ff}
</style>
</head>
<body>
<div class="hdr">
<div class="logo">C</div>
<div><div class="t">Password Generator</div><div class="sub">ChloeOS · Free forever</div></div>
<a class="back" href="../index.html">‹ Apps</a>
</div>
<div class="main">
<div class="card">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
<label style="font-size:15px">Length:</label>
<input type="number" id="len" value="20" min="8" max="64" style="width:80px;text-align:center">
</div>
<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:15px">
<input type="checkbox" id="sym" checked style="width:20px;height:20px"> Symbols (!@#$...)</label>
<label style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:15px">
<input type="checkbox" id="num" checked style="width:20px;height:20px"> Numbers</label>
<button class="btn" onclick="gen()">Generate Password</button>
<div class="out" id="out" style="margin-top:16px;font-size:18px;text-align:center;min-height:60px">Tap generate.</div>
<button class="btn sec" onclick="copyPw()">Copy</button>
<div style="text-align:center;color:#86868b;font-size:12px;margin-top:12px">Generated on your device. Nothing is sent anywhere.</div>
</div>
</div>
<div class="ftr">Made with <b>ChloeOS</b> · chloeos.live</div>
<script>
function gen(){const n=Math.min(64,Math.max(8,parseInt(document.getElementById('len').value)||20));
let cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
if(document.getElementById('num').checked)cs+='23456789';
if(document.getElementById('sym').checked)cs+='!@#$%^&*';
let o='';const a=new Uint32Array(n);crypto.getRandomValues(a);
for(let i=0;i<n;i++)o+=cs[a[i]%cs.length];
document.getElementById('out').textContent=o;}
function copyPw(){navigator.clipboard.writeText(document.getElementById('out').textContent);}
gen();
</script>
</body>
</html>
