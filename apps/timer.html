<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Focus Timer — ChloeOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#fff;border-bottom:1px solid #e0e0e5;padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.hdr .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#00c6ff,#0072ff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.hdr .t{font-weight:700;font-size:17px}
.hdr .sub{font-size:11px;color:#86868b;font-weight:400}
.hdr .back{margin-left:auto;color:#0072ff;text-decoration:none;font-size:15px}
.main{flex:1;padding:20px;max-width:600px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:16px}
.btn{display:block;width:100%;background:#0072ff;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.btn:active{opacity:.8}
.btn.sec{background:#e8e8ed;color:#0072ff}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid #d2d2d7;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;background:#fafafa}
textarea:focus,input:focus{outline:none;border-color:#0072ff}
.out{background:#f0f7ff;border-radius:12px;padding:14px;margin-top:12px;font-size:15px;line-height:1.6;word-break:break-word}
.ftr{text-align:center;padding:20px;color:#86868b;font-size:12px}
.ftr b{color:#0072ff}
</style>
</head>
<body>
<div class="hdr">
<div class="logo">C</div>
<div><div class="t">Focus Timer</div><div class="sub">ChloeOS · Free forever</div></div>
<a class="back" href="../index.html">‹ Apps</a>
</div>
<div class="main">
<div class="card" style="text-align:center">
<div id="display" style="font-size:64px;font-weight:200;letter-spacing:4px;margin:16px 0">25:00</div>
<div id="label" style="color:#86868b;margin-bottom:16px">Ready to focus</div>
<button class="btn" onclick="start()">Start Focus</button>
<button class="btn sec" onclick="reset()">Reset</button>
<div style="display:flex;gap:8px;margin-top:12px;justify-content:center">
<button class="btn sec" style="width:auto;padding:10px 20px" onclick="setT(15)">15m</button>
<button class="btn sec" style="width:auto;padding:10px 20px" onclick="setT(25)">25m</button>
<button class="btn sec" style="width:auto;padding:10px 20px" onclick="setT(50)">50m</button>
</div>
</div>
</div>
<div class="ftr">Made with <b>ChloeOS</b> · chloeos.live</div>
<script>
let sec=1500,int=null;
function draw(){const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');
document.getElementById('display').textContent=m+':'+s;}
function start(){if(int)return;document.getElementById('label').textContent='Focusing...';
int=setInterval(()=>{sec--;draw();if(sec<=0){clearInterval(int);int=null;
document.getElementById('label').textContent='Done! Take a break.';}},1000);}
function reset(){clearInterval(int);int=null;sec=1500;draw();
document.getElementById('label').textContent='Ready to focus';}
function setT(m){reset();sec=m*60;draw();}
draw();
</script>
</body>
</html>
