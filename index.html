<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChloeOS</title>
<meta name="description" content="ChloeOS — free tools. I am Chloe.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;user-select:none}
/* wallpaper */
#wall{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#0a1a3a 0%,#030308 60%,#000 100%);z-index:0}
#wall::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 80%,rgba(0,114,255,.15) 0%,transparent 50%)}
/* status bar */
#status{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top, 0px)) 24px 8px;font-size:13px;font-weight:600;color:#fff}
#status .icons{display:flex;gap:6px;align-items:center}
/* home screen */
#home{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;padding:calc(52px + env(safe-area-inset-top, 0px)) 20px 20px;transition:opacity .3s,transform .3s}
#home.hidden{opacity:0;transform:scale(1.08);pointer-events:none}
#clock{text-align:center;margin:18px 0 6px}
#clock .time{font-size:64px;font-weight:200;letter-spacing:2px}
#clock .date{font-size:14px;color:rgba(255,255,255,.7);margin-top:4px}
#brand{text-align:center;margin-bottom:26px}
#brand .name{font-size:15px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.9)}
#brand .sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:2px;margin-top:3px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;max-width:420px;margin:0 auto;width:100%}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.app .icon{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 16px rgba(0,0,0,.4);transition:transform .15s}
.app:active .icon{transform:scale(.88)}
.app .lbl{font-size:11px;color:#fff;text-align:center;line-height:1.2;max-width:72px}
#dock{margin-top:auto;background:rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px;padding:12px 18px;display:flex;justify-content:center;gap:20px;max-width:420px;margin-left:auto;margin-right:auto;width:100%}
/* app window */
#appwin{position:fixed;inset:0;z-index:20;background:#f5f5f7;color:#1d1d1f;display:none;flex-direction:column}
#appwin.open{position:fixed}
#appwin.open{display:flex;animation:slideUp .28s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#appwin .ahdr{background:#fff;border-bottom:1px solid #e0e0e5;padding:calc(14px + env(safe-area-inset-top, 20px)) 16px 14px;display:flex;align-items:center;gap:10px}
#appwin .ahdr .t{font-weight:700;font-size:17px;flex:1;text-align:center}
#appwin .ahdr .t{font-weight:700;font-size:17px;flex:1;text-align:center}
#appwin .abody{flex:1;overflow-y:auto;padding:20px 20px 110px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;justify-content:flex-end}
#appwin .actionbar{position:absolute;bottom:0;left:0;right:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(245,245,247,.95) 30%);display:flex;gap:10px}
#appwin .actionbar .btn{margin-top:0;flex:1}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.btn{display:block;width:100%;background:#0072ff;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit}
.btn:active{opacity:.8}
.btn.sec{background:#e8e8ed;color:#0072ff}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid #d2d2d7;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;background:#fafafa;color:#1d1d1f}
textarea:focus,input:focus{outline:none;border-color:#0072ff}
.out{background:#f0f7ff;border-radius:12px;padding:14px;margin-top:12px;font-size:15px;line-height:1.6;word-break:break-word;color:#1d1d1f}
#appwin .aftr{text-align:center;padding:14px;color:#86868b;font-size:11px;background:#fff;border-top:1px solid #e0e0e5}
#appwin .aftr b{color:#0072ff}
</style>
</head>
<body>
<div id="wall"></div>

<div id="status">
<span id="stime">--:--</span>
<span class="icons"><span>📶</span><span>🔋</span></span>
</div>

<div id="home">
<div id="clock"><div class="time" id="ctime">--:--</div><div class="date" id="cdate"></div></div>
<div id="brand"><div class="name">CHLOEOS</div><div class="sub">FREE TOOLS</div></div>
<div id="grid"></div>
<div id="dock"></div>
</div>

<div id="appwin">
<div class="ahdr"><span class="t" id="apptitle"></span></div>
<div class="abody" id="appbody"></div><div class="actionbar" id="appactions" style="display:none"></div>
<div class="aftr">Made with <b>ChloeOS</b></div>
</div>

<script>
const APPS=[
{id:'words',icon:'📝',bg:'linear-gradient(135deg,#34c759,#00c6a0)',name:'Word Counter',html:`<div class="card"><textarea id="w-in" rows="8" placeholder="Paste or type text..." oninput="wGo()"></textarea><div class="out" id="w-out">Start typing.</div></div>`,js:`function wGo(){const t=document.getElementById('w-in').value;const w=t.trim()?t.trim().split(/\\s+/).length:0;const ch=t.length;const sn=t.split(/[.!?]+/).filter(s=>s.trim()).length;document.getElementById('w-out').innerHTML='<b>'+w+'</b> words<br><b>'+ch+'</b> characters<br><b>'+sn+'</b> sentences<br><b>~'+Math.max(1,Math.ceil(w/200))+' min</b> read';}`},
{id:'color',actions:`<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('c-in').value)">Copy HEX</button>`,icon:'🎨',bg:'linear-gradient(135deg,#ff9500,#ff2d55)',name:'Color Picker',html:`<div class="card"><input type="color" id="c-in" value="#0072ff" oninput="cGo()" style="width:100%;height:80px;border:none;border-radius:12px;padding:0;cursor:pointer"><div class="out" id="c-out" style="margin-top:16px"></div></div>`,js:`function cGo(){const h=document.getElementById('c-in').value;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);document.getElementById('c-out').innerHTML='<div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:10px;background:'+h+'"></div><b style="font-size:20px">'+h.toUpperCase()+'</b></div><div style="margin-top:8px">RGB: <b>rgb('+r+', '+g+', '+b+')</b></div>';}cGo();`},
{id:'timer',actions:`<button class="btn" onclick="tStart()">Start</button><button class="btn sec" onclick="tReset()">Reset</button>`,icon:'⏱',bg:'linear-gradient(135deg,#5e5ce6,#bf5af2)',name:'Focus Timer',html:`<div class="card" style="text-align:center"><div id="t-d" style="font-size:64px;font-weight:200;margin:16px 0">25:00</div><div id="t-l" style="color:#86868b;margin-bottom:16px">Ready</div><div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn sec" style="width:auto;padding:10px 18px" onclick="tSet(15)">15m</button><button class="btn sec" style="width:auto;padding:10px 18px" onclick="tSet(25)">25m</button><button class="btn sec" style="width:auto;padding:10px 18px" onclick="tSet(50)">50m</button></div></div>`,js:`var tS=1500,tI=null;function tD(){var m=String(Math.floor(tS/60)).padStart(2,'0'),s=String(tS%60).padStart(2,'0');document.getElementById('t-d').textContent=m+':'+s;}function tStart(){if(tI)return;document.getElementById('t-l').textContent='Focusing...';tI=setInterval(function(){tS--;tD();if(tS<=0){clearInterval(tI);tI=null;document.getElementById('t-l').textContent='Done! Break time.';}},1000);}function tReset(){clearInterval(tI);tI=null;tS=1500;tD();document.getElementById('t-l').textContent='Ready';}function tSet(m){tReset();tS=m*60;tD();}tD();`},
{id:'case',actions:`<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('k-out').textContent)">Copy Result</button>`,icon:'🔤',bg:'linear-gradient(135deg,#00c6ff,#0072ff)',name:'Case Converter',html:`<div class="card"><textarea id="k-in" rows="5" placeholder="Type or paste..."></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn sec" onclick="kGo('u')">UPPER</button><button class="btn sec" onclick="kGo('l')">lower</button><button class="btn sec" onclick="kGo('t')">Title</button><button class="btn sec" onclick="kGo('a')">aLtErNaTe</button></div><div class="out" id="k-out" style="margin-top:16px;min-height:50px">Result here.</div></div>`,js:`function kGo(m){var t=document.getElementById('k-in').value,o=t;if(m=='u')o=t.toUpperCase();else if(m=='l')o=t.toLowerCase();else if(m=='t')o=t.replace(/\\w\\S*/g,function(w){return w[0].toUpperCase()+w.slice(1).toLowerCase()});else o=[...t].map(function(c,i){return i%2?c.toLowerCase():c.toUpperCase()}).join('');document.getElementById('k-out').textContent=o;}`},
{id:'pass',actions:`<button class="btn" onclick="pGen()">Generate</button><button class="btn sec" onclick="navigator.clipboard.writeText(document.getElementById('p-out').textContent)">Copy</button>`,icon:'🔐',bg:'linear-gradient(135deg,#30b0c7,#0072ff)',name:'Password Gen',html:`<div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:14px"><label>Length:</label><input type="number" id="p-len" value="20" min="8" max="64" style="width:70px;text-align:center"></div><div class="out" id="p-out" style="margin-top:14px;font-size:17px;text-align:center;min-height:56px">Tap generate.</div><div style="text-align:center;color:#86868b;font-size:11px;margin-top:10px">On-device only. Nothing sent anywhere.</div></div>`,js:`function pGen(){var n=Math.min(64,Math.max(8,parseInt(document.getElementById('p-len').value)||20));var cs='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*';var o='',a=new Uint32Array(n);crypto.getRandomValues(a);for(var i=0;i<n;i++)o+=cs[a[i]%cs.length];document.getElementById('p-out').textContent=o;}pGen();`},
{id:'b64',actions:`<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('b-out').textContent)">Copy Result</button>`,icon:'🔢',bg:'linear-gradient(135deg,#ac8e68,#6e5a3e)',name:'Base64',html:`<div class="card"><textarea id="b-in" rows="5" placeholder="Text or Base64..."></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button class="btn sec" onclick="bGo('e')">Encode →</button><button class="btn sec" onclick="bGo('d')">← Decode</button></div><div class="out" id="b-out" style="margin-top:16px;min-height:50px">Result here.</div></div>`,js:`function bGo(m){var t=document.getElementById('b-in').value;try{document.getElementById('b-out').textContent=m=='e'?btoa(unescape(encodeURIComponent(t))):decodeURIComponent(escape(atob(t)));}catch(e){document.getElementById('b-out').textContent='Invalid input.';}}`},
{id:'mag',icon:'🔍',bg:'linear-gradient(135deg,#1d1d1f,#3a3a3c)',name:'Magnifier',html:`
<div style="position:relative;width:100%;height:calc(100vh - 220px);min-height:400px;background:#000;border-radius:16px;overflow:hidden">
<video id="mg-vid" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;transform-origin:center"></video>
<div id="mg-err" style="display:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#86868b;text-align:center;padding:20px">Camera not available.<br>Open this on chloeos.live over HTTPS and allow camera access.</div>
<div style="position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.75))">
<div style="text-align:center;color:#fff;font-size:24px;font-weight:700;margin-bottom:8px"><span id="mg-z">1.0</span>×</div>
<input type="range" id="mg-slider" min="1" max="8" step="0.1" value="1" oninput="mgZoom(this.value)" style="width:100%;accent-color:#fff">
<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
<button onclick="mgSet(1)" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:10px 24px;font-size:15px;font-weight:600;backdrop-filter:blur(10px)">1×</button>
<button onclick="mgSet(2)" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:10px 24px;font-size:15px;font-weight:600;backdrop-filter:blur(10px)">2×</button>
<button onclick="mgSet(4)" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:10px 24px;font-size:15px;font-weight:600;backdrop-filter:blur(10px)">4×</button>
<button onclick="mgTorch()" style="background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:20px;padding:10px 18px;font-size:15px;backdrop-filter:blur(10px)">🔦</button>
</div>
</div>
</div>`,js:`
var mgStream=null,mgTrack=null,mgTorchOn=false;
function mgZoom(v){document.getElementById('mg-z').textContent=parseFloat(v).toFixed(1);document.getElementById('mg-vid').style.transform='scale('+v+')';}
function mgSet(v){document.getElementById('mg-slider').value=v;mgZoom(v);}
function mgTorch(){if(!mgTrack)return;mgTorchOn=!mgTorchOn;mgTrack.applyConstraints({advanced:[{torch:mgTorchOn}]}).catch(function(){});}
(function(){var v=document.getElementById('mg-vid');
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('mg-err').style.display='flex';v.style.display='none';return;}
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(s){
mgStream=s;mgTrack=s.getVideoTracks()[0];v.srcObject=s;
window._mgStop=function(){if(mgStream){mgStream.getTracks().forEach(function(t){t.stop()});mgStream=null;}};
}).catch(function(){document.getElementById('mg-err').style.display='flex';v.style.display='none';});})();
`},{id:'yt',icon:'▶',bg:'linear-gradient(135deg,#ff3b30,#ff2d55)',name:'YouTube',url:'https://www.youtube.com/@Chloe_OS',dock:1},
{id:'tt',icon:'♪',bg:'linear-gradient(135deg,#000,#333)',name:'TikTok',url:'https://www.tiktok.com/@chloeosmaster',dock:1},
];

const grid=document.getElementById('grid'),dock=document.getElementById('dock');
APPS.filter(a=>!a.dock).forEach(a=>{
const d=document.createElement('div');d.className='app';
d.innerHTML=`<div class="icon" style="background:${a.bg}">${a.icon}</div><div class="lbl">${a.name}</div>`;
d.onclick=()=>openApp(a.id);grid.appendChild(d);});
APPS.filter(a=>a.dock).forEach(a=>{
const d=document.createElement('div');d.className='app';
d.innerHTML=`<div class="icon" style="background:${a.bg}">${a.icon}</div><div class="lbl">${a.name}</div>`;
d.onclick=()=>window.open(a.url,'_blank');dock.appendChild(d);});

function openApp(id){
const a=APPS.find(x=>x.id===id);if(!a)return;
document.getElementById('apptitle').textContent=a.name;
document.getElementById('appbody').innerHTML=a.html;
const ab=document.getElementById('appactions');
var closeBtn='<button class="btn" onclick="closeApp()" style="background:#ff3b30;flex:0 0 auto;padding:14px 20px">✕</button>';
if(a.actions){ab.innerHTML=closeBtn+a.actions;ab.style.display='flex';}
else{ab.innerHTML=closeBtn;ab.style.display='flex';}
document.getElementById('home').classList.add('hidden');document.getElementById('status').style.display='none';
document.getElementById('appwin').classList.add('open');
const s=document.createElement('script');s.textContent=a.js;document.getElementById('appbody').appendChild(s);
document.getElementById('appbody').scrollTop=0;
}
function closeApp(){if(window._mgStop){window._mgStop();window._mgStop=null;}
document.getElementById('appwin').classList.remove('open');
document.getElementById('home').classList.remove('hidden');document.getElementById('status').style.display='flex';
}
function tick(){
const n=new Date();
const t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
document.getElementById('stime').textContent=t;
document.getElementById('ctime').textContent=t;
document.getElementById('cdate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
tick();setInterval(tick,10000);
</script>
</body>
</html>
